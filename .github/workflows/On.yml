name: RedWolf Recovery Build - Ubuntu 22.04

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE_URL:
        description: Device Tree URL
        required: true
        default: 'https://github.com/ansh-m14x/android-recovery-OP4C7D'
      DEVICE_TREE_BRANCH:
        description: Device Tree Branch
        required: true
        default: 'redwolf'
      DEVICE_PATH:
        description: Sync Path
        required: true
        default: 'device/oppo/OP4C7D'
      DEVICE_NAME:
        description: Device Name
        required: true
        default: 'OP4C7D'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cleanup Space
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /usr/local/lib/android /opt/ghc
        sudo apt clean

    - name: Install Build Packages
      run: |
        sudo apt-get update
        sudo apt-get -y install libncurses5 python2 python3 \
        git ccache automake flex lzop bison gperf build-essential zip curl \
        zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 \
        libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool \
        make optipng maven libssl-dev pwgen libswitch-perl policycoreutils \
        minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 \
        lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip \
        device-tree-compiler libtinfo5
        
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Initialize & Sync RedWolf
      run: |
        mkdir workspace && cd workspace
        git config --global user.name "Ansh_m14x"
        git config --global user.email "ansh@example.com"
        
        # 1. Init using HTTPS
        repo init -u https://github.com/RedWolfRecovery/rw_manifest.git -b rw --depth=1
        
        # 2. Fix the broken path in manifest before sync
        sed -i 's|path="TeamWin/.repo/|path="|g' .repo/manifests/default.xml
        
        # 3. Sync
        repo sync -j$(nproc --all) --force-sync --no-tags --no-clone-bundle
      
    - name: Clone Device Tree
      run: |
        git clone ${{ inputs.DEVICE_TREE_URL }} -b ${{ inputs.DEVICE_TREE_BRANCH }} workspace/${{ inputs.DEVICE_PATH }}

    - name: Build RedWolf
      run: |
        cd workspace
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch omni_${{ inputs.DEVICE_NAME }}-eng
        mka recoveryimage -j$(nproc --all)

    - name: Release Build
      uses: ncipollo/release-action@v1.12.0
      with:
        artifacts: workspace/out/target/product/${{ inputs.DEVICE_NAME }}/recovery.img
        name: RedWolf for ${{ inputs.DEVICE_NAME }} - ${{ github.run_id }}
        tag: ${{ inputs.DEVICE_NAME }}-${{ github.run_id }}
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
          Build by Ansh_m14x
          Device: ${{ inputs.DEVICE_NAME }} (Oppo A31)
          Target: RedWolf Recovery Image
