name: SHRP Recovery Build - Oppo A31

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'SHRP Manifest URL'
        required: true
        default: 'https://github.com/SHRP/manifest'
      MANIFEST_BRANCH:
        description: 'SHRP Branch'
        required: true
        default: 'shrp-12.1'
      DEVICE_TREE_URL:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/ansh-m14x/recovery-oppo-A31-OP4C7D'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'shrp'
      DEVICE_PATH:
        description: 'Device Path'
        required: true
        default: 'device/oppo/OP4C7D'
      DEVICE_NAME:
        description: 'Device Name'
        required: true
        default: 'OP4C7D'
      MAKEFILE_NAME:
        description: 'Makefile Name'
        required: true
        default: 'shrp_OP4C7D'

jobs:
  build:
    runs-on: ubuntu-latest
    # Using Ubuntu 20.04 container for native Python 2 and build tool compatibility
    container:
      image: ubuntu:20.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Prepare Environment
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y \
          git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev \
          gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
          libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip python2 \
          bc liblz4-tool libssl-dev rsync maven wget lzip python3 python-is-python2

    - name: Install Google Repo
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize & Sync
      run: |
        mkdir workspace
        cd workspace
        git config --global user.name "Ansh"
        git config --global user.email "ansh@example.com"
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
        repo sync -j$(nproc --all) --force-sync --no-tags --no-clone-bundle

    - name: Clone Device Tree
      run: |
        cd workspace
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}

    - name: Build SHRP
      run: |
        cd workspace
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
        mka recoveryimage -j$(nproc --all)
      shell: bash

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SHRP-OppoA31
        path: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/SHRP*.zip
