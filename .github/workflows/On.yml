name: SkyHawk [SHRP]

on:
  workflow_dispatch:
    inputs:
      MANIFEST:
        description: 'SHRP Manifest'
        required: true
        default: 'https://github.com/SHRP-Reborn/manifest.git'
      MANIFEST_BRANCH:
        description: 'SHRP Manifest Branch'
        required: true
        default: 'shrp-12.1'
        type: choice
        options:
        - shrp-12.1
        - shrp-9.0
        - v3_11.0
        - v3_9.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/ansh-m14x/recovery-oppo-A31-OP4C7D' 
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'shrp'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/oppo/OP4C7D'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'OP4C7D'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot

jobs:
  build:
    name: Build SHRP by ${{ github.actor }}
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      # Absolute path for container volume
      OUTPUT_DIR: /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}/android-recovery/out/target/product
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v4
      
    - name: Prepare Environment
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt update && apt -y upgrade
        apt -y install git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev \
          gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
          libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc \
          liblz4-tool libssl-dev rsync maven wget lzip python3 python2 python-is-python2 \
          imagemagick libbz2-dev lzma ncftp qemu-user-static libtinfo5

    - name: Setup Git-Repo
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize & Sync Repo
      run: |
        mkdir android-recovery && cd android-recovery
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        repo init --depth=1 -u ${{ inputs.MANIFEST }} -b ${{ inputs.MANIFEST_BRANCH }}
        repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd android-recovery
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git -C ${{ inputs.DEVICE_PATH }} rev-parse HEAD)" >> $GITHUB_ENV

    - name: Check Build Makefile
      run: |
        cd android-recovery
        if [ -f ${{ inputs.DEVICE_PATH }}/shrp_${{ inputs.DEVICE_NAME}}.mk ]; then
            echo "DEVICE_MAKEFILE=shrp_${{ inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        elif [ -f ${{ inputs.DEVICE_PATH }}/twrp_${{ inputs.DEVICE_NAME}}.mk ]; then
            echo "DEVICE_MAKEFILE=twrp_${{ inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        elif [ -f ${{ inputs.DEVICE_PATH }}/omni_${{ inputs.DEVICE_NAME}}.mk ]; then
            echo "DEVICE_MAKEFILE=omni_${{ inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        else
            echo "No recovery makefile found!" && exit 1
        fi

    - name: Building SkyHawk
      run: |
        cd android-recovery
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ env.DEVICE_MAKEFILE }}-eng
        make clean
        mka ${{ inputs.BUILD_TARGET }}image -j$(nproc --all)

    - name: Upload to Release
      if: always()
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ env.OUTPUT_DIR }}/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
          ${{ env.OUTPUT_DIR }}/${{ inputs.DEVICE_NAME }}/SHRP*.zip
        name: SHRP Unofficial for ${{ inputs.DEVICE_NAME }}
        tag_name: ${{ github.run_id }}
        body: "Build results for ${{ inputs.DEVICE_NAME }}. Based on ${{ inputs.MANIFEST_BRANCH }}."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
