name: Recovery Build - Ubuntu Latest

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        type: choice
        description: TWRP Manifest Branch
        options:
        - 9.0
        - 11
        - 12.1
        required: true
        default: 9.0
      DEVICE_TREE_URL:
        description: Device Tree URL
        required: true
        default: https://github.com/Ansh-m14x/android_device_oppo_CPH2015
      DEVICE_TREE_BRANCH:
        description: Device Tree Branch
        required: true
        default: main
      DEVICE_PATH:
        description: Sync Path
        required: true
        default: device/oppo/OP4C7D
      DEVICE_NAME:
        description: Device Name
        required: true
        default: OP4C7D

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cleanup Space
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /usr/local/lib/android /opt/ghc
        sudo apt clean

    - name: Install Legacy Dependencies (Ubuntu Latest)
      run: |
        sudo apt update
        # Install Python 2 manually since it's removed from ubuntu-latest
        sudo apt install -y python2-minimal
        sudo ln -sf /usr/bin/python2 /usr/bin/python
        # Essential build tools
        sudo apt install -y gperf gcc-multilib g++-multilib libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev liblz4-tool libncurses5 libsdl1.2-dev libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libtinfo5

    - name: Install OpenJDK 8
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 8

    - name: Install Repo Tool
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
      
    - name: Initialize & Sync
      run: |
        mkdir workspace && cd workspace
        git config --global user.name "Ansh_m14x"
        git config --global user.email "ansh@example.com"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-${{ inputs.MANIFEST_BRANCH }}
        repo sync -j$(nproc --all) --force-sync --no-tags --no-clone-bundle
      
    - name: Clone Device Tree
      run: |
        git clone ${{ inputs.DEVICE_TREE_URL }} -b ${{ inputs.DEVICE_TREE_BRANCH }} workspace/${{ inputs.DEVICE_PATH }}

    - name: Build TWRP
      run: |
        cd workspace
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        source build/envsetup.sh
        lunch omni_${{ inputs.DEVICE_NAME }}-eng
        make recoveryimage -j$(nproc --all)

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-OppoA31-Ansh
        path: workspace/out/target/product/${{ inputs.DEVICE_NAME }}/recovery.img

    - name: Release to GitHub
      uses: softprops/action-gh-release@v1
      with:
        files: workspace/out/target/product/${{ inputs.DEVICE_NAME }}/recovery.img
        name: TWRP Build - ${{ inputs.DEVICE_NAME }}
        tag_name: ${{ github.run_id }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
