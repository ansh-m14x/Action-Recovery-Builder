name: OrangeFox - Build (Oppo A31 Omni)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree URL'
        required: true
        default: 'https://github.com/ansh-m14x/android-recovery-OP4C7D'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'patched-12.1'
      DEVICE_PATH:
        description: 'Device Path'
        required: true
        default: 'device/oppo/OP4C7D'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'OP4C7D'

jobs:
  build:
    name: Build OrangeFox by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean-up Environment
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
      
    - name: Install Build Tools
      run: |
        sudo apt update
        sudo apt install -y git aria2 python3 python3-pip zip unzip
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
      
    - name: Sync OrangeFox Source
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "Ansh"
        git config --global user.email "ansh@example.com"
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git -C ${{ github.event.inputs.DEVICE_PATH }} rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Build OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_DEVICE=${{ github.event.inputs.DEVICE_NAME }}
        export LC_ALL=C
        
        # ⚡ Omni-specific lunch command
        lunch omni_${{ github.event.inputs.DEVICE_NAME }}-eng
        
        mka recoveryimage -j$(nproc --all)

    - name: Verify and Pack
      run: |
        OUT_PATH=${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        if [ -f $OUT_PATH/OrangeFox*.img ]; then
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
            echo "FINAL_PATH=$OUT_PATH" >> $GITHUB_ENV
        else
            echo "Build failed! Image not found."
            exit 1
        fi

    - name: Upload Release
      if: env.BUILD_SUCCESS == 'true'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ env.FINAL_PATH }}/OrangeFox*.img
          ${{ env.FINAL_PATH }}/OrangeFox*.zip
        name: OrangeFox Unofficial - ${{ github.event.inputs.DEVICE_NAME }}
        tag_name: ${{ github.run_id }}
        body: |
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
          Commit: ${{ env.COMMIT_ID }}
          Status: Stable Build (Omni Source)
