name: Recovery Build - PBRP 9.0 (CPH2015)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Manifest Branch'
        required: true
        default: '9.0'
      DEVICE_TREE_URL:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/Ansh-m14x/android_device_oppo_CPH2015'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Sync Path'
        required: true
        default: 'device/oppo/OP4C7D'
      DEVICE_NAME:
        description: 'Device Name'
        required: true
        default: 'OP4C7D'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cleanup Space
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /usr/local/lib/android /opt/ghc
        sudo apt clean

    - name: Install Build Packages
      run: |
        sudo apt-get update
        sudo apt-get -y install libncurses5 python2 python3 \
        git ccache automake flex lzop bison gperf build-essential zip curl \
        zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 \
        libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool \
        make optipng maven libssl-dev pwgen libswitch-perl policycoreutils \
        minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 \
        lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip \
        device-tree-compiler libtinfo5
        
        # Force Python 2 for Android 9.0 build scripts
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Install OpenJDK 8
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 8

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
      
    - name: Initialize & Sync (Minimal + PBRP Fix)
      run: |
        mkdir workspace && cd workspace
        git config --global user.name "Ansh_m14x"
        git config --global user.email "ansh@example.com"
        
        # Step 1: Initialize Minimal TWRP 9.0 (Stable Base)
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-9.0
        
        # Step 2: Sync Core Files
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
        
        # Step 3: Clone PBRP Specific Folders
        git clone https://github.com/PitchBlackRecoveryProject/vendor_pb.git -b pb vendor/pb
        git clone https://github.com/PitchBlackRecoveryProject/vendor_utils.git -b pb vendor/utils
        git clone https://github.com/PitchBlackRecoveryProject/android_bootable_recovery.git -b android-9.0 bootable/recovery-pbrp
        
        # Step 4: FIX Duplicate Soong Definition (Conflict Solve)
        rm -rf vendor/omni/build/soong
        
        # Step 5: Replace TWRP recovery with PBRP recovery
        rm -rf bootable/recovery
        mv bootable/recovery-pbrp bootable/recovery
      
    - name: Clone Device Tree
      run: |
        cd workspace
        git clone ${{ inputs.DEVICE_TREE_URL }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ${{ inputs.DEVICE_PATH }}

    - name: Build PBRP
      run: |
        cd workspace
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        source build/envsetup.sh
        lunch omni_${{ inputs.DEVICE_NAME }}-eng
        make recoveryimage -j$(nproc --all)

    - name: Release Build
      uses: ncipollo/release-action@v1.12.0
      with:
        artifacts: workspace/out/target/product/${{ inputs.DEVICE_NAME }}/recovery.img
        name: PBRP-OppoA31-${{ github.run_id }}
        tag: ${{ inputs.DEVICE_NAME }}-${{ github.run_id }}
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
          Build by Ansh_m14x
          Device: Oppo A31 (CPH2015)
          Manifest: TWRP 9.0 + PBRP Source
          Status: Stable Compile
