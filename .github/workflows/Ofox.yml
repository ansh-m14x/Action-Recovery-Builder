name: Recovery Build - LineageOS 16.0 (CPH2015)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP/Omni Manifest Branch'
        required: true
        default: '9.0'
      DEVICE_TREE_URL:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/Ansh-m14x/android_device_oppo_CPH2015'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Sync Path'
        required: true
        default: 'device/oppo/OP4C7D'
      DEVICE_NAME:
        description: 'Device Name'
        required: true
        default: 'OP4C7D'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cleanup Space
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /usr/local/lib/android /opt/ghc
        sudo apt clean

    - name: Install Build Packages
      run: |
        sudo apt-get update
        sudo apt-get -y install libncurses5 python2 python3 \
        git ccache automake flex lzop bison gperf build-essential zip curl \
        zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 \
        libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool \
        make optipng maven libssl-dev pwgen libswitch-perl policycoreutils \
        minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 \
        lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip \
        device-tree-compiler libtinfo5
        
        # Force Python 2 for 9.0 legacy scripts
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Install OpenJDK 8
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 8

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
      
    - name: Initialize & Sync (LOS 16.0 Base)
      run: |
        mkdir workspace && cd workspace
        git config --global user.name "Ansh_m14x"
        git config --global user.email "ansh@example.com"
        
        # Using Minimal Manifest for stability
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-9.0
        
        # Syncing...
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
      
    - name: Clone Device Tree
      run: |
        cd workspace
        git clone ${{ inputs.DEVICE_TREE_URL }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ${{ inputs.DEVICE_PATH }}

    - name: Build Lineage Recovery
      run: |
        cd workspace
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        source build/envsetup.sh
        # Note: Lunching with lineage prefix as per your .mk file
        lunch lineage_${{ inputs.DEVICE_NAME }}-eng
        make recoveryimage -j$(nproc --all)

    - name: Release Build
      uses: ncipollo/release-action@v1.12.0
      with:
        artifacts: workspace/out/target/product/${{ inputs.DEVICE_NAME }}/recovery.img
        name: LOS-Recovery-OppoA31-${{ github.run_id }}
        tag: ${{ inputs.DEVICE_NAME }}-${{ github.run_id }}
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
          Build by Ansh_m14x
          Device: Oppo A31 (CPH2015)
          Manifest: LineageOS 16.0 / TWRP 9.0 Base
          DTBO: Included in build
