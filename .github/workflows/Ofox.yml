name: PBRP Build - Ubuntu 22.04

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE_URL:
        description: Device Tree URL
        required: true
        default: https://github.com/Ansh-m14x/android_device_oppo_CPH2015
      DEVICE_TREE_BRANCH:
        description: Device Tree Branch
        required: true
        default: ofox
      DEVICE_PATH:
        description: Sync Path
        required: true
        default: device/oppo/OP4C7D
      DEVICE_NAME:
        description: Device Name
        required: true
        default: OP4C7D

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cleanup & Install Packages
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /usr/local/lib/android /opt/ghc
        sudo apt-get update
        sudo apt-get -y install libncurses5 python2 python3 git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush xz-utils schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler libtinfo5
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Install OpenJDK 8
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 8

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
      
    - name: Initialize & Sync PBRP (With Manifest Fix)
      run: |
        mkdir workspace && cd workspace
        git config --global user.name "Ansh_m14x"
        git config --global user.email "ansh@example.com"
        
        # Initializing with the branch shown in your screenshot
        repo init --depth=1 -u https://github.com/PitchBlackRecoveryProject/manifest_pb.git -b Android-9.0
        
        # Fix for the 'Remote ref not found' sync error
        cd .repo/manifests
        sed -i 's/refs\/heads\/Android-9.0/Android-9.0/g' default.xml
        sed -i 's/refs\/heads\/android-9.0/Android-9.0/g' default.xml
        cd ../..
        
        repo sync -c -j4 --force-sync --no-tags --no-clone-bundle

    - name: Clone Device Tree
      run: |
        git clone ${{ inputs.DEVICE_TREE_URL }} -b ${{ inputs.DEVICE_TREE_BRANCH }} workspace/${{ inputs.DEVICE_PATH }}

    - name: Build PBRP
      run: |
        cd workspace
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        source build/envsetup.sh
        lunch pbrp_${{ inputs.DEVICE_NAME }}-eng || lunch omni_${{ inputs.DEVICE_NAME }}-eng
        make pbrp -j$(nproc --all) || make recoveryimage -j$(nproc --all)

    - name: Release Build
      uses: ncipollo/release-action@v1.12.0
      with:
        artifacts: workspace/out/target/product/${{ inputs.DEVICE_NAME }}/PBRP-*.zip,workspace/out/target/product/${{ inputs.DEVICE_NAME }}/recovery.img
        name: PBRP for ${{ inputs.DEVICE_NAME }}
        tag: PBRP-${{ github.run_id }}
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
          ### PitchBlack Recovery Project
          - **Maintainer:** Ansh_m14x
          - **Device:** Oppo A31 (CPH2015)
          - **Brightness Fix:** 4095 Max / 1024 Default
          - **Status:** Unofficial
