name: OrangeFox Recovery Builder (fox_9.0)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
    - name: Cleanup Space
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install Build Tools
      run: |
        sudo apt update
        sudo apt install -y bc build-essential zip curl libncurses5-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python2

    - name: Setup Repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH

    - name: Sync OrangeFox Source
      run: |
        mkdir ~/orangefox
        cd ~/orangefox
        export PATH=~/bin:$PATH
        repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b fox_9.0
        repo sync -j$(nproc --all) --force-sync

    - name: Clone Your Device Tree
      run: |
        cd ~/orangefox
        # Pura path ensure kar rahe hain: device/manufacturer/device_code
        git clone https://github.com/Ansh-m14x/android-recovery-OP4C7D -b pbrp device/oppo/OP4C7D

    - name: Build OrangeFox
      run: |
        cd ~/orangefox
        export PATH=~/bin:$PATH
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_VERSION="R11.1"
        export FOX_BUILD_TYPE="Unofficial"
        lunch omni_OP4C7D-eng
        mka recoveryimage -j$(nproc --all)

    - name: Upload Recovery Image
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-OppoA31
        path: ~/orangefox/out/target/product/OP4C7D/recovery.img
