name: PitchBlack Recovery Project Builder

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'PBRP Manifest Branch'
        required: true
        default: 'android-9.0'
        type: choice
        options:
        - android-12.1
        - android-11.0
        - android-10.0
        - android-9.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree URL'
        required: true
        default: 'https://github.com/Ansh-m14x/android-recovery-OP4C7D'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'pbrp'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'pbrp'
        type: choice
        options:
        - pbrp
        - recovery

jobs:
  build:
    name: Build PBRP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      
    steps:
    - name: Initial Setup
      run: |
        echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV
        echo "BUILD_DATE=$(TZ=UTC date +%Y%m%d)" >> $GITHUB_ENV
        
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Build PitchBlack Recovery
      uses: mlm-games/pitchblack-pbrp-builder-action@main
      id: build
      with:
        MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
        DEVICE_TREE: ${{ inputs.DEVICE_TREE }}
        DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
        BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
  
    - name: Upload to Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ env.OUTPUT_DIR }}/*.img
          ${{ env.OUTPUT_DIR }}/*.zip
        name: PBRP for Oppo A31 - ${{ env.BUILD_DATE }}
        tag_name: PBRP-${{ github.run_id }}
        body: |
          ## PitchBlack Recovery Unofficial
          - **Device:** Oppo A31 (OP4C7D)
          - **Branch:** ${{ inputs.MANIFEST_BRANCH }}
          - **Maintainer:** Ansh_m14x
          
          Build completed successfully!
        prerelease: false
        draft: false
